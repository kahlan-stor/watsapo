<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم واتساب الأعمال</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,sans-serif}
    body{display:flex;min-height:100vh;background:#111b21;color:#e9edef}
    #sidebar{width:280px;background:#202c33;border-left:1px solid #2a3942;padding:20px;display:flex;flex-direction:column}
    #sidebar h2{text-align:center;color:#00a884;margin-bottom:20px;font-size:1.2rem}
    .nav-btn{background:#2a3942;color:#e9edef;border:0;padding:12px;margin-bottom:10px;border-radius:8px;cursor:pointer;text-align:right}
    .nav-btn:hover,.nav-btn.active{background:#00a884;color:#111b21;font-weight:bold}
    #main-content{flex:1;padding:30px;display:flex;flex-direction:column;gap:20px}
    .card{background:#202c33;padding:20px;border-radius:10px;border:1px solid #2a3942}
    .status-badge{display:inline-block;padding:5px 12px;border-radius:15px;background:#00a884;color:#111b21;font-weight:bold}
    .toggle-container{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .action-btn{background:#00a884;border:0;padding:10px 20px;color:#111b21;border-radius:5px;font-weight:bold;cursor:pointer}
    #log-box{background:#0b141a;padding:15px;border-radius:8px;height:220px;overflow-y:auto;font-family:monospace;font-size:.85rem;color:#25d366}
    .muted{color:#8696a0;font-size:.85rem;margin-top:8px}
    @media(max-width:700px){
      body{display:block}
      #sidebar{width:100%;border-left:0;border-bottom:1px solid #2a3942}
      #main-content{padding:15px}
      .toggle-container{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>واتساب الأعمال الذكي</h2>
    <button class="nav-btn active" onclick="switchTab(this,'overview')">📌 النظرة العامة</button>
    <button class="nav-btn" onclick="switchTab(this,'chats')">💬 الدردشات</button>
    <button class="nav-btn" onclick="switchTab(this,'calls')">📞 سجل المكالمات</button>
    <button class="nav-btn" onclick="switchTab(this,'statuses')">👁️ الحالات</button>
    <button class="nav-btn" onclick="switchTab(this,'settings')">⚙️ إعدادات الذكاء الاصطناعي</button>
  </aside>

  <main id="main-content">
    <section class="card">
      <h3>حالة الاتصال</h3>
      <p style="margin-top:10px">الحالة الحالية:
        <span id="bot-status" class="status-badge">جاري التحميل...</span>
      </p>
      <p class="muted">يتم تشغيل WhatsApp Web داخل جلسة محفوظة محلياً. امسح رمز QR عند ظهوره في بيئة تشغيل تدعم عرض المتصفح.</p>
    </section>

    <section class="card toggle-container">
      <div>
        <h3>الرد الآلي الذكي (Gemini AI)</h3>
        <p class="muted">تحكم في تشغيل/إيقاف الرد الآلي من لوحة التحكم.</p>
      </div>
      <button id="toggle-btn" class="action-btn" onclick="toggleAutoReply()">تغيير الحالة</button>
    </section>

    <section class="card">
      <h3>سجل العمليات المباشر</h3>
      <div id="log-box" style="margin-top:10px">[System] جاري بدء النظام...<br></div>
    </section>
  </main>

<script>
const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);
const logBox = document.getElementById("log-box");
const statusEl = document.getElementById("bot-status");

function addLog(message){
  logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${message}<br>`;
  logBox.scrollTop = logBox.scrollHeight;
}

ws.onopen = () => addLog("تم الاتصال بلوحة التحكم.");
ws.onmessage = event => {
  const data = JSON.parse(event.data);
  if(data.type === "status"){
    statusEl.textContent = data.msg;
    addLog(data.msg);
  }
  if(data.type === "log") addLog(data.msg);
};
ws.onclose = () => addLog("انقطع اتصال WebSocket.");

async function toggleAutoReply(){
  const res = await fetch("/api/toggle-auto-reply", {method:"POST"});
  const data = await res.json();
  addLog(`الرد الآلي الآن: ${data.auto_reply ? "مفعل" : "معطل"}`);
}

function switchTab(button, tabName){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  addLog(`الانتقال إلى شاشة: ${tabName}`);
}
</script>
</body>
</html>
