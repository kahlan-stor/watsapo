<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp QR Bot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101d;color:#eef6ff;font-family:Arial,sans-serif}
main{max-width:720px;margin:auto;padding:22px}.card{background:#0c1a2b;border:1px solid #1c3550;border-radius:22px;padding:22px;margin-bottom:16px}
h1{margin:0 0 8px}.muted{color:#9db0c4}.status{display:flex;gap:10px;align-items:center;margin:20px 0;font-size:18px}
.dot{width:12px;height:12px;border-radius:50%;background:#8795a7}.ok{background:#22d477}.qr{display:none;background:#fff;border-radius:16px;padding:14px;justify-content:center;margin:20px 0}.qr img{max-width:100%;width:380px}
button{border:0;border-radius:10px;padding:12px 18px;background:#1677ff;color:#fff}code{background:#07111e;padding:4px 7px;border-radius:6px}
</style>
</head>
<body><main>
<section class="card">
<h1>📱 WhatsApp QR Bot</h1><div class="muted">WhatsApp + Telegram • Railway</div>
<div class="status"><span id="dot" class="dot"></span><strong id="state">STARTING</strong></div>
<p>الرد التلقائي: <strong id="reply">...</strong></p>
<div id="qrBox" class="qr"><img id="qr" alt="WhatsApp QR"></div>
<p id="hint" class="muted">جاري تجهيز الاتصال...</p><button onclick="refresh()">تحديث</button>
</section>
<section class="card"><h2>🤖 أوامر Telegram</h2>
<p><code>/awake</code> تشغيل الرد</p><p><code>/sleep</code> إيقاف الرد</p><p><code>/message نص</code> تغيير الرسالة</p><p><code>/status</code> الحالة</p></section>
</main>
<script>
async function refresh(){
 try{
  const s=await fetch("/api/status").then(r=>r.json());
  state.textContent=s.whatsapp;reply.textContent=s.autoReply?"مفعل ✅":"متوقف ⛔";
  dot.className="dot "+(s.whatsapp==="CONNECTED"?"ok":"");
  if(s.hasQr){
   const q=await fetch("/api/qr").then(r=>r.json());qr.src=q.qr;qrBox.style.display="flex";
   hint.textContent="WhatsApp ← الإعدادات ← الأجهزة المرتبطة ← ربط جهاز ثم امسح QR.";
  }else{
   qrBox.style.display="none";hint.textContent=s.whatsapp==="CONNECTED"?"✅ واتساب متصل.":"⏳ انتظر ظهور QR...";
  }
 }catch(e){state.textContent="SERVER ERROR";}
}
refresh();setInterval(refresh,3000);
</script></body></html>
